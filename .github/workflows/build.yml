name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack project.zip
        run: |
          mkdir -p work
          unzip -q project.zip -d work
          ls work

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle -p work assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FMC-F31-debug-apk
          path: work/app/build/outputs/apk/debug/*.apk
